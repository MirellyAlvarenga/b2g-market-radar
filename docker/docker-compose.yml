services:
  postgres:
    image: postgres:16-alpine
    container_name: b2g_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-b2g_market_radar}
      POSTGRES_USER: ${POSTGRES_USER:-b2g_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2g_secret_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-b2g_admin} -d ${POSTGRES_DB:-b2g_market_radar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl-pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: b2g_etl_pipeline
    profiles: ["pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-b2g_market_radar}
      POSTGRES_USER: ${POSTGRES_USER:-b2g_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2g_secret_password}

  airflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: b2g_airflow
    profiles: ["airflow"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/orchestration/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: b2g_airflow_secret_key
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-b2g_market_radar}
      POSTGRES_USER: ${POSTGRES_USER:-b2g_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2g_secret_password}
    volumes:
      - ..:/opt/airflow/project
    command: standalone

volumes:
  postgres_data: