name: B2G Market Radar — CI/CD & Scheduled Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Executa diariamente às 09:00 UTC (06:00 horário de Brasília)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci-quality-checks:
    name: CI — Pytest & dbt Parse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (pytest)
        run: pytest -v

      - name: Validate dbt models and YAML syntax
        working-directory: transformation
        run: dbt parse --profiles-dir .

  scheduled-e2e-pipeline:
    name: CD — End-to-End Pipeline & dbt Docs
    needs: ci-quality-checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: b2g_market_radar
          POSTGRES_USER: b2g_admin
          POSTGRES_PASSWORD: b2g_secret_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: b2g_market_radar
      POSTGRES_USER: b2g_admin
      POSTGRES_PASSWORD: b2g_secret_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run incremental ingestion (PNCP + BrasilAPI)
        run: |
          python -m ingestion.pncp_contratacoes
          python -m ingestion.pncp_contratos --max-paginas 10
          python -m ingestion.brasilapi_cnpj --limit 50

      - name: Run dbt transformations and data quality tests
        working-directory: transformation
        run: |
          dbt run --profiles-dir .
          dbt test --profiles-dir .
          dbt docs generate --profiles-dir . --static

      - name: Publish updated dbt docs to GitHub Pages folder
        run: |
          mkdir -p docs
          cp transformation/target/static_index.html docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "chore(docs): auto-update dbt lineage catalog"
          git push